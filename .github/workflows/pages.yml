# Publica o CINZAS (exportação estática do Next) no GitHub Pages: https://<usuario>.github.io/cinzas/
# Ative uma vez em Settings → Pages → Source: "GitHub Actions". Depois, todo push na main publica sozinho.
name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Teste de fumaça em Chrome headless, em paralelo e sem travar a publicação (usa a build SEM subcaminho).
  teste:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes de lógica e balanço (Node)
        run: npm run teste
      - run: npm run build
      - name: Smoke test (Chrome headless)
        run: node tools/smoke.mjs
        env:
          CHROME: /usr/bin/google-chrome
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build estático (com subcaminho /cinzas)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.implantacao.outputs.page_url }}
    steps:
      - id: implantacao
        uses: actions/deploy-pages@v4
